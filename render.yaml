services:
  # Backend API
  - type: web
    name: stock-valuation-api
    runtime: python
    rootDir: multi-model-stock-valuation/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health
    plan: free

  # Frontend Static Site
  - type: web
    name: stock-valuation-frontend
    runtime: static
    rootDir: multi-model-stock-valuation/frontend
    buildCommand: echo "Static site - no build needed"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
